name: "Seal CLI Action"

description: "Runs Seal CLI on a target directory"

author: "Seal Community"

branding:
  icon: "shield"
  color: "blue"

inputs:
  version:
    description: "CLI version to use, same as a tag - e.g. v0.1.0; empty will use latest"
    default: ""
  target:
    description: "Path to manifest file declaring the dependencies, such as 'requirements.txt', 'package-lock.json', etc. "
    default: "./requirements.txt"
  mode:
    description: "Fix or scan; scan requires seal token as env"
    default: "scan"
  fix_mode:
    description: "local or all; fix according to the local config or fix everything"
    default: "local"
  verbosity:
    description: "Verbosity: v, vv, vvv"
    default: "v"
  summary:
    description: "Path to summary file, by default does not generate; only relevant for 'fix' mode"
    default: ""
  project:
    description: "Used as part of cli authentication for fix command, can be any* value"
    default: ""
  upload_scan_results:
    description: "Uploads the list of vulnerable packages to the Seal platform"
    default: "false"
  verify_signature:
    description: "Verifies the downloaded CLI's signature before running it: cosign with Seal's release signing key on Linux and Windows, Seal's Apple Developer ID and notarization on macOS; only 'false' turns it off"
    default: "true"
  CLI_TOKEN:
    required: false # required for fix mode
    description: "Authentication token to the seal artifact server"
  token:
    required: false # required for fix mode. only one of CLI_TOKEN and token is required
    description: "Authentication token to the seal artifact server"

runs:
  using: "composite"
  steps:
    - name: "Set Fix Mode"
      id: fix_mode_flag
      shell: bash
      if: inputs.mode == 'fix'
      run: |
        echo "fix_mode_flag=--mode ${{ inputs.fix_mode }}" >> ${GITHUB_OUTPUT}
    - name: "Determine token value"
      id: determine_token
      shell: bash
      run: |
        if [[ "${{ inputs.token }}" ]]; then
          echo "token=${{ inputs.token }}" >> ${GITHUB_OUTPUT}
        elif [[ "${{ inputs.CLI_TOKEN }}" ]]; then
          echo "token=${{ inputs.CLI_TOKEN }}" >> ${GITHUB_OUTPUT}
        else
          echo "token=" >> ${GITHUB_OUTPUT}
        fi
    - name: "Download CLI"
      id: download
      shell: bash
      env:
        CLI_REPO: "seal-community/cli"
        CLI_VERSION: ${{ inputs.version }}
      run: |
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) PLATFORM="linux-amd64"; EXT="zip" ;;
          Linux-ARM64) PLATFORM="linux-arm64"; EXT="zip" ;;
          Windows-X64) PLATFORM="windows-amd64"; EXT="zip" ;;
          macOS-X64) PLATFORM="darwin-amd64"; EXT="pkg" ;;
          macOS-ARM64) PLATFORM="darwin-arm64"; EXT="pkg" ;;
          *)
            echo "::error::Unsupported runner: ${RUNNER_OS} ${RUNNER_ARCH}"
            exit 1
            ;;
        esac
        # asset names carry the release tag, and the newest release is also tagged "latest"
        TAG="${CLI_VERSION:-latest}"
        ASSET="seal-${PLATFORM}-${TAG}.${EXT}"
        URL="https://github.com/${CLI_REPO}/releases/download/${TAG}/${ASSET}"
        CLI_DIR="${RUNNER_TEMP}/seal-cli"
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          CLI_DIR="$(cygpath -u "${RUNNER_TEMP}")/seal-cli"
        fi
        # not concurrent-safe for multiple jobs
        rm -rf "${CLI_DIR}"
        mkdir -p "${CLI_DIR}"
        ARCHIVE="${CLI_DIR}/${ASSET}"
        echo "Downloading ${URL}"
        if command -v curl > /dev/null 2>&1; then
          curl --retry 3 -fsSL "${URL}" -o "${ARCHIVE}"
        elif command -v wget > /dev/null 2>&1; then
          wget -q --tries=3 "${URL}" -O "${ARCHIVE}"
        else
          echo "::error::The runner has neither curl nor wget to download the Seal CLI; install one of them before this action runs"
          exit 1
        fi
        case "${RUNNER_OS}" in
          Linux)
            unzip -q "${ARCHIVE}" -d "${CLI_DIR}"
            CLI_PATH="${CLI_DIR}/seal"
            ;;
          Windows)
            unzip -q "${ARCHIVE}" -d "${CLI_DIR}"
            CLI_PATH="${CLI_DIR}/seal.exe"
            ;;
          macOS)
            # the pkg installs into /usr/local/bin; expanding it instead needs no sudo
            pkgutil --expand-full "${ARCHIVE}" "${CLI_DIR}/pkg"
            CLI_PATH="${CLI_DIR}/pkg/Payload/seal"
            ;;
        esac
        echo "cli_dir=${CLI_DIR}" >> ${GITHUB_OUTPUT}
        echo "archive_path=${ARCHIVE}" >> ${GITHUB_OUTPUT}
        echo "cli_path=${CLI_PATH}" >> ${GITHUB_OUTPUT}
    - name: "Provide envsubst for cosign-installer"
      if: runner.os == 'Linux' && inputs.verify_signature != 'false'
      shell: bash
      run: |
        # cosign-installer only passes its install-dir through envsubst, and the install-dir below has no variables,
        # so on images without gettext a pass-through stand-in gives the same result
        if ! command -v envsubst > /dev/null 2>&1; then
          mkdir -p "${RUNNER_TEMP}/seal-shims"
          printf '#!/bin/sh\nexec cat\n' > "${RUNNER_TEMP}/seal-shims/envsubst"
          chmod +x "${RUNNER_TEMP}/seal-shims/envsubst"
          echo "${RUNNER_TEMP}/seal-shims" >> "${GITHUB_PATH}"
        fi
    - name: "Install cosign"
      if: runner.os != 'macOS' && inputs.verify_signature != 'false'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: "v3.1.3"
        install-dir: ${{ runner.temp }}/seal-cosign
    - name: "Remove the envsubst stand-in"
      # even when cosign-installer fails, so that no later step mistakes the stand-in for the real envsubst
      if: always() && runner.os == 'Linux'
      shell: bash
      run: rm -rf "${RUNNER_TEMP}/seal-shims"
    - name: "Verify CLI signature - Linux and Windows"
      if: runner.os != 'macOS' && inputs.verify_signature != 'false'
      shell: bash
      env:
        CLI_DIR: ${{ steps.download.outputs.cli_dir }}
        CLI_PATH: ${{ steps.download.outputs.cli_path }}
        SEAL_CLI_PUBLIC_KEY: |
          -----BEGIN PUBLIC KEY-----
          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEEYDZPJicyOmWP4o/Ul9joeSUMW3L
          L7vSXIFZ7UH01UfYw+jLnwYI3ELErC7aMFeGjGqA+GrACLrytNvWXqU4cQ==
          -----END PUBLIC KEY-----
      run: |
        # the bundle is named like the binary: seal.sigstore.json, or seal.exe.sigstore.json on Windows
        BUNDLE="${CLI_PATH}.sigstore.json"
        if [[ ! -f "${BUNDLE}" ]]; then
          echo "::error::The Seal CLI release has no signature bundle ($(basename "${BUNDLE}")). Linux releases before v0.3.365 and Windows releases before v0.3.370 are unsigned; set verify_signature: false to run them"
          exit 1
        fi
        printf '%s' "${SEAL_CLI_PUBLIC_KEY}" > "${CLI_DIR}/seal-cli.pub"
        cosign verify-blob --key "${CLI_DIR}/seal-cli.pub" --bundle "${BUNDLE}" "${CLI_PATH}"
    - name: "Verify CLI signature - macOS"
      if: runner.os == 'macOS' && inputs.verify_signature != 'false'
      shell: bash
      env:
        PKG_PATH: ${{ steps.download.outputs.archive_path }}
        CLI_PATH: ${{ steps.download.outputs.cli_path }}
        SEAL_APPLE_TEAM_ID: "SNZS6SJMFA"
      run: |
        # the installer must be notarized and both it and the binary must carry Seal's Apple Developer ID signature
        PKG_SIGNATURE=$(pkgutil --check-signature "${PKG_PATH}")
        echo "${PKG_SIGNATURE}"
        if ! grep -q "Status: signed by a developer certificate issued by Apple for distribution" <<< "${PKG_SIGNATURE}" \
          || ! grep -q "1\. Developer ID Installer: .*(${SEAL_APPLE_TEAM_ID})" <<< "${PKG_SIGNATURE}"; then
          echo "::error::The Seal CLI installer is not signed with Seal's Apple Developer ID"
          exit 1
        fi
        if ! grep -q "Notarization: trusted by the Apple notary service" <<< "${PKG_SIGNATURE}"; then
          echo "::error::The Seal CLI installer is not notarized by Apple"
          exit 1
        fi
        codesign --verify --strict --verbose=2 \
          -R="anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = \"${SEAL_APPLE_TEAM_ID}\"" \
          "${CLI_PATH}"
    - name: "Run CLI"
      shell: bash
      run: |
        CLI_PATH="${{ steps.download.outputs.cli_path }}"
        echo "Running cli from ${CLI_PATH}"
        SUMMARY_PARAM=""
        if [[ "${{ inputs.summary }}" != "" ]] && [[ "${{ inputs.mode }}" == "fix" ]]; then
            SUMMARY_PARAM="--summarize --summary-file-path ${{ inputs.summary}}"
        fi
        UPLOAD_SCAN_RESULTS=""
        if [[ "${{ inputs.upload_scan_results }}" == "true" ]]; then
            UPLOAD_SCAN_RESULTS="--upload-scan-results"
        fi
        SEAL_PROJECT=${{ inputs.project }} SEAL_TOKEN=${{ steps.determine_token.outputs.token }} "${CLI_PATH}" -${{ inputs.verbosity }} ${{ inputs.mode }} ${{ steps.fix_mode_flag.outputs.fix_mode_flag }} ${{ inputs.target }} ${SUMMARY_PARAM} ${UPLOAD_SCAN_RESULTS} 
